version: '3.8'

services:
  pawprint-ai:
    build: .
    container_name: pawprint_ai_app
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./pawprint.db:/app/pawprint.db
      - ./backend/model:/app/backend/model
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
